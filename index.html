  <!-- Non-blocking font load: stylesheet downloads in parallel, applies when ready.
       System fonts render instantly; web fonts swap in. Removed Space Grotesk (unused).
       Trimmed JetBrains Mono to a single weight; Inter to 400/700 only. -->
  <link
    rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&display=swap">
  </noscript>

    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- AdSense moved out of <head> and deferred until after first paint + idle.
       This removes ~200-600ms of contention from the critical path. -->
  <script>
    (function () {
      function loadAds() {
        if (window.__adsLoaded) return;
        window.__adsLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5996986714127353';
        document.head.appendChild(s);
      }
      var trigger = function () {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAds, { timeout: 4000 });
        } else {
          setTimeout(loadAds, 2500);
        }
      };
      if (document.readyState === 'complete') trigger();
      else window.addEventListener('load', trigger, { once: true });
    })();
  </script>
</body>
